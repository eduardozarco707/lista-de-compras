<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Esta línea es CLAVE para que se vea bien en celulares (responsive) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Lista Digital</title>
    <style>
        :root {
            --primary: #4f46e5;
            --danger: #ef4444;
            --success: #10b981;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            min-height: 100vh; /* En celular ocupa toda la altura */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }
        /* Para computadoras, le damos márgenes y bordes redondeados */
        @media (min-width: 640px) {
            .container {
                min-height: auto;
                margin-top: 2rem;
                margin-bottom: 2rem;
                border-radius: 12px;
                overflow: hidden;
            }
        }
        header {
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 1.5rem 1rem;
        }
        h1 { margin: 0; font-size: 1.5rem; }
        .tabs { display: flex; background: #e5e7eb; }
        .tab {
            flex: 1;
            text-align: center;
            padding: 1rem;
            cursor: pointer;
            font-weight: bold;
            color: #4b5563;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            user-select: none;
        }
        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: white;
        }
        .content { padding: 1.5rem; display: none; flex: 1; }
        .content.active { display: block; }
        .input-group { display: flex; gap: 10px; margin-bottom: 1.5rem; }
        
        input[type="text"] {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus { border-color: var(--primary); }
        
        button {
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        .btn-add { background: var(--primary); color: white; }
        .btn-action { background: var(--success); color: white; }
        .btn-delete { background: var(--danger); color: white; padding: 0.5rem 0.75rem; }
        
        .item-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.75rem; }
        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
        .item-name { font-size: 1rem; word-break: break-word; margin-right: 10px; }
        .actions { display: flex; gap: 0.5rem; }
        
        /* Ajuste de botones para pantallas de celulares muy pequeños */
        @media (max-width: 480px) {
            .actions { flex-direction: column; }
            .actions button { width: 100%; padding: 0.5rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🛒 Gestor de Compras</h1>
    </header>
    
    <div class="tabs">
        <div class="tab active" onclick="switchTab('productos-tab')" id="tab-productos">Productos</div>
        <div class="tab" onclick="switchTab('lista-tab')" id="tab-lista">Lista de Compra</div>
    </div>

    <!-- PESTAÑA PRODUCTOS -->
    <div id="productos-tab" class="content active">
        <div class="input-group">
            <input type="text" id="input-producto" placeholder="Ej. Arroz, Leche, Manzanas..." onkeypress="if(event.key==='Enter') agregarProducto()">
            <button class="btn-add" onclick="agregarProducto()">Agregar</button>
        </div>
        <ul class="item-list" id="contenedor-productos">
            <!-- Cargado con JavaScript -->
        </ul>
    </div>

    <!-- PESTAÑA LISTA DE COMPRA -->
    <div id="lista-tab" class="content">
        <ul class="item-list" id="contenedor-lista">
            <!-- Cargado con JavaScript -->
        </ul>
    </div>
</div>

<script>
    // Cambiar Pestañas
    function switchTab(tabId) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        if(tabId === 'productos-tab') {
            document.getElementById('tab-productos').classList.add('active');
        } else {
            document.getElementById('tab-lista').classList.add('active');
        }
        cargarDatos();
    }

    // Funciones API
    async function fetchApi(url, method = 'GET', body = null) {
        const options = { method, headers: { 'Content-Type': 'application/json' } };
        if (body) options.body = JSON.stringify(body);
        const response = await fetch(url, options);
        return response.json();
    }

    async function cargarDatos() {
        const productos = await fetchApi('/api/productos');
        const lista = await fetchApi('/api/lista');
        
        // Renderizar Productos
        const contProd = document.getElementById('contenedor-productos');
        contProd.innerHTML = '';
        if(productos.length === 0) {
            contProd.innerHTML = '<p style="text-align:center; color:#6b7280; font-style:italic;">No hay productos. ¡Agrega uno nuevo!</p>';
        }
        productos.forEach(p => {
            contProd.innerHTML += `
                <li class="item">
                    <span class="item-name">${p}</span>
                    <div class="actions">
                        <button class="btn-action" onclick="moverALista('${p}')">Añadir 🛒</button>
                        <button class="btn-delete" onclick="eliminarProducto('${p}')">🗑️ Eliminar</button>
                    </div>
                </li>
            `;
        });

        // Renderizar Lista
        const contLista = document.getElementById('contenedor-lista');
        contLista.innerHTML = '';
        if(lista.length === 0) {
            contLista.innerHTML = '<p style="text-align:center; color:#6b7280; font-style:italic;">Tu lista de compras está vacía.</p>';
        }
        lista.forEach(p => {
            contLista.innerHTML += `
                <li class="item">
                    <span class="item-name">✅ ${p}</span>
                    <div class="actions">
                        <button class="btn-delete" onclick="quitarDeLista('${p}')">Quitar</button>
                    </div>
                </li>
            `;
        });
    }

    async function agregarProducto() {
        const input = document.getElementById('input-producto');
        const nombre = input.value.trim();
        if (nombre) {
            await fetchApi('/api/productos', 'POST', { nombre });
            input.value = '';
            cargarDatos();
        }
    }

    async function eliminarProducto(nombre) {
        await fetchApi('/api/productos', 'DELETE', { nombre });
        cargarDatos();
    }

    async function moverALista(nombre) {
        await fetchApi('/api/lista', 'POST', { nombre });
        cargarDatos();
    }

    async function quitarDeLista(nombre) {
        await fetchApi('/api/lista', 'DELETE', { nombre });
        cargarDatos();
    }

    // Inicializar app
    cargarDatos();
</script>
</body>
</html>
