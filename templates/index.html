<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Lista Digital</title>
    
    <!-- Aquí cargamos el FAVICON desde la carpeta static -->
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='favicon.jpg') }}">
    
    <style>
        /* TEMA BLANCO Y NEGRO */
        :root {
            --black: #000000;
            --white: #ffffff;
            --gray: #e5e7eb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--gray);
            color: var(--black);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            border-left: 2px solid var(--black);
            border-right: 2px solid var(--black);
        }
        @media (min-width: 640px) {
            .container {
                min-height: auto;
                margin-top: 2rem;
                margin-bottom: 2rem;
                border: 3px solid var(--black);
                box-shadow: 8px 8px 0px var(--black); /* Sombra dura estilo retro/minimalista */
            }
        }
        header {
            background: var(--white);
            color: var(--black);
            text-align: center;
            padding: 1.5rem 1rem;
            border-bottom: 3px solid var(--black);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .logo {
            max-height: 80px; /* Ajusta este valor si tu logo es muy grande o muy pequeño */
            width: auto;
        }
        h1 { margin: 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 900;}
        
        .tabs { display: flex; border-bottom: 3px solid var(--black); background: var(--gray); }
        .tab {
            flex: 1;
            text-align: center;
            padding: 1rem;
            cursor: pointer;
            font-weight: bold;
            color: #555;
            border-bottom: 4px solid transparent;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .tab.active {
            color: var(--black);
            background: var(--white);
            border-bottom: 4px solid var(--black);
        }
        
        .content { padding: 1.5rem; display: none; flex: 1; }
        .content.active { display: block; }
        .input-group { display: flex; gap: 10px; margin-bottom: 1.5rem; }
        
        input[type="text"] {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid var(--black);
            font-size: 1rem;
            outline: none;
            background: var(--white);
        }
        input[type="text"]:focus { background: var(--gray); }
        
        button {
            padding: 0.75rem 1rem;
            border: 2px solid var(--black);
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        button:active { transform: scale(0.95); }
        
        /* Botones Blanco y Negro */
        .btn-add { background: var(--black); color: var(--white); }
        .btn-add:hover { background: var(--white); color: var(--black); }
        
        .btn-action { background: var(--white); color: var(--black); }
        .btn-action:hover { background: var(--black); color: var(--white); }
        
        .btn-delete { background: var(--white); color: var(--black); border-style: dashed; padding: 0.5rem 0.75rem; }
        .btn-delete:hover { background: var(--gray); }
        
        .item-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.75rem; }
        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--white);
            padding: 0.75rem 1rem;
            border: 2px solid var(--black);
        }
        .item-name { font-size: 1rem; font-weight: bold; word-break: break-word; margin-right: 10px; }
        .actions { display: flex; gap: 0.5rem; }
        
        @media (max-width: 480px) {
            .actions { flex-direction: column; }
            .actions button { width: 100%; padding: 0.5rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <!-- Aquí cargamos el LOGO desde la carpeta static -->
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo de la aplicación" class="logo">
        <h1>Gestor de Compras</h1>
    </header>
    
    <div class="tabs">
        <div class="tab active" onclick="switchTab('productos-tab')" id="tab-productos">Productos</div>
        <div class="tab" onclick="switchTab('lista-tab')" id="tab-lista">Lista de Compra</div>
    </div>

    <!-- PESTAÑA PRODUCTOS -->
    <div id="productos-tab" class="content active">
        <div class="input-group">
            <input type="text" id="input-producto" placeholder="EJ. ARROZ, LECHE..." onkeypress="if(event.key==='Enter') agregarProducto()">
            <button class="btn-add" onclick="agregarProducto()">Agregar</button>
        </div>
        <ul class="item-list" id="contenedor-productos">
            <!-- Cargado con JavaScript -->
        </ul>
    </div>

    <!-- PESTAÑA LISTA DE COMPRA -->
    <div id="lista-tab" class="content">
        <ul class="item-list" id="contenedor-lista">
            <!-- Cargado con JavaScript -->
        </ul>
    </div>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        if(tabId === 'productos-tab') {
            document.getElementById('tab-productos').classList.add('active');
        } else {
            document.getElementById('tab-lista').classList.add('active');
        }
        cargarDatos();
    }

    async function fetchApi(url, method = 'GET', body = null) {
        const options = { method, headers: { 'Content-Type': 'application/json' } };
        if (body) options.body = JSON.stringify(body);
        const response = await fetch(url, options);
        return response.json();
    }

    async function cargarDatos() {
        const productos = await fetchApi('/api/productos');
        const lista = await fetchApi('/api/lista');
        
        const contProd = document.getElementById('contenedor-productos');
        contProd.innerHTML = '';
        if(productos.length === 0) {
            contProd.innerHTML = '<p style="text-align:center; font-style:italic; border: 1px dashed black; padding: 10px;">NO HAY PRODUCTOS.</p>';
        }
        productos.forEach(p => {
            contProd.innerHTML += `
                <li class="item">
                    <span class="item-name">${p}</span>
                    <div class="actions">
                        <button class="btn-action" onclick="moverALista('${p}')">AÑADIR ➔</button>
                        <button class="btn-delete" onclick="eliminarProducto('${p}')">X BORRAR</button>
                    </div>
                </li>
            `;
        });

        const contLista = document.getElementById('contenedor-lista');
        contLista.innerHTML = '';
        if(lista.length === 0) {
            contLista.innerHTML = '<p style="text-align:center; font-style:italic; border: 1px dashed black; padding: 10px;">LISTA VACÍA.</p>';
        }
        lista.forEach(p => {
            contLista.innerHTML += `
                <li class="item">
                    <span class="item-name">✓ ${p}</span>
                    <div class="actions">
                        <button class="btn-delete" onclick="quitarDeLista('${p}')">QUITAR</button>
                    </div>
                </li>
            `;
        });
    }

    async function agregarProducto() {
        const input = document.getElementById('input-producto');
        const nombre = input.value.trim().toUpperCase();
        if (nombre) {
            await fetchApi('/api/productos', 'POST', { nombre });
            input.value = '';
            cargarDatos();
        }
    }

    async function eliminarProducto(nombre) {
        await fetchApi('/api/productos', 'DELETE', { nombre });
        cargarDatos();
    }

    async function moverALista(nombre) {
        await fetchApi('/api/lista', 'POST', { nombre });
        cargarDatos();
    }

    async function quitarDeLista(nombre) {
        await fetchApi('/api/lista', 'DELETE', { nombre });
        cargarDatos();
    }

    cargarDatos();
</script>
</body>
</html>
